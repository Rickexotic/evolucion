<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Evolución Humana</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header class="hero">

        <div class="hero-inner">

            <div class="hero-period">7 MILLONES DE AÑOS</div>

            <h1>Evolución Humana</h1>

            <p>
                Desde los primeros homininos
                hasta Homo sapiens y el surgimiento
                de la civilización.
            </p>

        </div>

    </header>

    <main id="tree">
        <svg id="tree-svg" aria-hidden="true"></svg>
    </main>

    <!-- Escenario: especie seleccionada, centrada sobre el panel -->
    <div id="stage" aria-hidden="true">

        <div class="stage-area">

            <div class="stage-line"></div>

            <figure class="stage-figure">

                <div class="stage-halo"></div>

                <div class="stage-image">
                    <img id="stage-img" src="" alt="">
                </div>

                <figcaption>
                    <h2 id="stage-name"></h2>
                    <p id="stage-period"></p>
                </figcaption>

            </figure>

        </div>

    </div>

    <!-- Panel inferior con la ficha -->
    <section
        id="species-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="stage-name">

        <div class="panel-bar">

            <div class="panel-nav">

                <button id="panel-prev" class="panel-btn" type="button">
                    Anterior
                </button>

                <span id="panel-count" class="panel-count"></span>

                <button id="panel-next" class="panel-btn" type="button">
                    Siguiente
                </button>

            </div>

            <button id="panel-close" class="panel-btn" type="button">
                Cerrar panel
            </button>

        </div>

       <div id="panel-body" class="panel-body">

    <div id="panel-content" class="panel-grid">

        <div id="panel-importance"></div>

        <div id="panel-morphology"></div>

        <div id="panel-facts"></div>

    </div>

</div>

    </section>

    <script src="app.js"></script>

    <script src="https://unpkg.com/three"></script>

<script src="https://unpkg.com/globe.gl"></script>

</body>

</html>
